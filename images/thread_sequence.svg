<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad3)"/>

  <text x="480" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CamMf Thread Synchronization &amp; Data Transfer Flow</text>

  <!-- Thread Headers -->
  <!-- Main Thread -->
  <rect x="140" y="70" width="220" height="50" rx="10" fill="#0369a1"/>
  <text x="250" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Main Thread (UI/Render)</text>
  <line x1="250" y1="120" x2="250" y2="470" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Shared State -->
  <rect x="400" y="70" width="160" height="50" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <text x="480" y="93" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Shared State</text>
  <text x="480" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">mtx / captured / image</text>
  <line x1="480" y1="120" x2="480" y2="470" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Capture Thread -->
  <rect x="600" y="70" width="220" height="50" rx="10" fill="#6d28d9"/>
  <text x="710" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Capture Thread (thr)</text>
  <line x1="710" y1="120" x2="710" y2="470" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Timeline Actions -->

  <!-- 1. Start Thread -->
  <path d="M 250 150 L 700 150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="475" y="142" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">start() -&gt; spawn thread (this-&gt;capture())</text>

  <!-- 2. ReadSample loop -->
  <rect x="650" y="180" width="120" height="40" rx="6" fill="#4c1d95"/>
  <text x="710" y="205" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ReadSample()</text>

  <!-- 3. MFT Decode / Convert -->
  <rect x="640" y="235" width="140" height="40" rx="6" fill="#5b21b6"/>
  <text x="710" y="260" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ProcessOutput() -&gt; RGB</text>

  <!-- 4. Lock & Copy to Image -->
  <path d="M 710 295 L 490 295" stroke="#34d399" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="600" y="290" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">std::lock_guard&lt;std::mutex&gt; lock(mtx)</text>

  <rect x="430" y="305" width="100" height="30" rx="4" fill="#065f46"/>
  <text x="480" y="325" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">memcpy(image) &amp; captured=true</text>

  <!-- 5. Main Thread Transmit -->
  <path d="M 250 360 L 470 360" stroke="#fb923c" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="350" y="352" fill="#fb923c" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">transmit(PBO) [std::try_to_lock]</text>

  <rect x="180" y="375" width="140" height="35" rx="6" fill="#9a3412"/>
  <text x="250" y="397" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">glBufferSubData (GPU)</text>

  <path d="M 250 420 L 470 420" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="350" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">reset captured = false</text>

  <!-- Notes -->
  <rect x="50" y="440" width="340" height="50" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
  <text x="65" y="460" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Non-blocking Transmit:</text>
  <text x="65" y="478" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">try_to_lock 失敗時は描写スキップ（フレームドロップ回避）</text>

  <rect x="570" y="440" width="340" height="50" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
  <text x="585" y="460" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Prioritize Latency Mode:</text>
  <text x="585" y="478" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">prioritizeLatency=true 時は古い取得済みバッファを高速上書き</text>
</svg>
