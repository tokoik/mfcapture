<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad2)"/>
  
  <text x="480" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CamMf MFT Processing Pipeline Routing</text>

  <!-- Branch 1: MJPG / H.264 -->
  <g transform="translate(40, 80)">
    <rect width="880" height="110" rx="12" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1.5"/>
    
    <!-- Input Box -->
    <rect x="20" y="25" width="130" height="60" rx="8" fill="#581c87"/>
    <text x="85" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MJPG / H.264</text>
    <text x="85" y="70" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Compressed Stream</text>

    <!-- Arrow -->
    <path d="M 150 55 L 210 55" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr-purple)"/>

    <!-- Step 1: MFT Decoder -->
    <rect x="220" y="20" width="180" height="70" rx="8" fill="#7c3aed"/>
    <text x="310" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MFT Decoder</text>
    <text x="310" y="68" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Low Latency Mode = 1</text>

    <!-- Arrow -->
    <path d="M 400 55 L 460 55" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr-purple)"/>

    <!-- Intermediate Format -->
    <rect x="470" y="30" width="90" height="50" rx="6" fill="#3b0764" stroke="#c084fc" stroke-dasharray="3,3"/>
    <text x="515" y="60" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NV12</text>

    <!-- Arrow -->
    <path d="M 560 55 L 620 55" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr-purple)"/>

    <!-- Step 2: Color Convert -->
    <rect x="630" y="20" width="190" height="70" rx="8" fill="#2563eb"/>
    <text x="725" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MFT Color Converter</text>
    <text x="725" y="68" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">CLSID_CColorConvertDMO</text>
  </g>

  <!-- Branch 2: NV12 / YUY2 -->
  <g transform="translate(40, 210)">
    <rect width="880" height="110" rx="12" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Input Box -->
    <rect x="20" y="25" width="130" height="60" rx="8" fill="#0369a1"/>
    <text x="85" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NV12 / YUY2</text>
    <text x="85" y="70" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Uncompressed YUV</text>

    <!-- Direct Line to Color Converter -->
    <path d="M 150 55 L 620 55" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
    <text x="380" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Bypass Decoder (No Decoding Needed)</text>

    <!-- Step: Color Convert -->
    <rect x="630" y="20" width="190" height="70" rx="8" fill="#2563eb"/>
    <text x="725" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MFT Color Converter</text>
    <text x="725" y="68" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">CLSID_CColorConvertDMO</text>
  </g>

  <!-- Final Output Stage -->
  <g transform="translate(40, 340)">
    <rect width="880" height="100" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>

    <path d="M 725 -20 L 725 25" stroke="#34d399" stroke-width="3" marker-end="url(#arr-green)"/>

    <rect x="580" y="25" width="270" height="55" rx="8" fill="#047857"/>
    <text x="715" y="50" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Output: RGB32 (RGBA)</text>
    <text x="715" y="68" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">CPU Buffer -&gt; OpenGL PBO / cv::Mat</text>
  </g>
</svg>
