<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="mftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb923c" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Box: CamMf Class Boundary -->
  <rect x="190" y="70" width="580" height="410" rx="16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <text x="210" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">CamMf Class (Windows Media Foundation Layer)</text>

  <!-- 1. Media Source -->
  <g filter="url(#shadow)">
    <rect x="40" y="220" width="120" height="80" rx="12" fill="url(#camGrad)"/>
    <text x="100" y="255" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">UVC Camera</text>
    <text x="100" y="275" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">MJPG / NV12 / YUY2</text>
  </g>

  <!-- Arrow: Camera -> SourceReader -->
  <path d="M 160 260 L 220 260" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>

  <!-- 2. Source Reader -->
  <g filter="url(#shadow)">
    <rect x="230" y="210" width="140" height="100" rx="12" fill="url(#mfGrad)"/>
    <text x="300" y="245" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">IMFSourceReader</text>
    <text x="300" y="268" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ReadSample()</text>
    <text x="300" y="288" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Low Latency Mode</text>
  </g>

  <!-- Arrow: SourceReader -> MFT Decoder -->
  <path d="M 370 260 L 420 260" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3. MFT Pipeline Subsystem -->
  <rect x="430" y="130" width="160" height="260" rx="14" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" opacity="0.9" filter="url(#shadow)"/>
  <text x="510" y="158" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MFT Pipeline</text>

  <!-- MFT Decoder -->
  <rect x="445" y="175" width="130" height="70" rx="8" fill="url(#mftGrad)"/>
  <text x="510" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MFT Decoder</text>
  <text x="510" y="225" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(MJPG/H264 -> NV12)</text>

  <!-- Arrow: Decoder -> Converter -->
  <path d="M 510 245 L 510 275" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- MFT Converter -->
  <rect x="445" y="285" width="130" height="70" rx="8" fill="url(#mftGrad)"/>
  <text x="510" y="315" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MFT Converter</text>
  <text x="510" y="335" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(NV12/YUY2 -> RGB32)</text>

  <!-- Arrow: MFT -> CPU Buffer -->
  <path d="M 590 320 L 640 320" stroke="#c084fc" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- 4. CPU Buffer (image) -->
  <g filter="url(#shadow)">
    <rect x="650" y="270" width="100" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="700" y="310" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CPU Frame</text>
    <text x="700" y="330" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">std::vector</text>
    <text x="700" y="348" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">image (RGBA)</text>
  </g>

  <!-- Arrow: CPU Buffer -> OpenGL PBO -->
  <path d="M 750 320 L 820 320" stroke="#fb923c" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- 5. OpenGL PBO / GPU -->
  <g filter="url(#shadow)">
    <rect x="830" y="220" width="130" height="120" rx="12" fill="url(#gpuGrad)"/>
    <text x="895" y="260" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">OpenGL GPU</text>
    <text x="895" y="285" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Pixel Buffer (PBO)</text>
    <text x="895" y="310" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">transmit()</text>
  </g>

  <!-- Sub Components: ComInitializer -->
  <rect x="230" y="115" width="170" height="55" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="315" y="138" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ComInitializer (Singleton)</text>
  <text x="315" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">CoInitializeEx / MFStartup</text>
  <path d="M 315 170 L 315 210" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Sub Component: Thread Sync -->
  <rect x="635" y="115" width="130" height="60" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="700" y="138" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Thread Sync</text>
  <text x="700" y="156" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">std::mutex &amp; atomic</text>
  <path d="M 700 175 L 700 270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="40" y="440" width="400" height="40" rx="8" fill="#1e293b" opacity="0.8"/>
  <circle cx="65" cy="460" r="6" fill="#34d399"/>
  <text x="78" y="464" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Compressed / YUV</text>

  <circle cx="185" cy="460" r="6" fill="#c084fc"/>
  <text x="198" y="464" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Decoded / Converted (RGB)</text>

  <circle cx="335" cy="460" r="6" fill="#fb923c"/>
  <text x="348" y="464" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">PBO Transfer</text>
</svg>
